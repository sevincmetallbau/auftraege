<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auftragsübersicht – Sevinc Metallbau</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #111827;
    color: #e5e7eb;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    background: #1f2937;
    border-bottom: 4px solid #e94560;
    padding: 16px 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header-logo {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .header-logo h1 {
    font-size: 1.8rem;
    font-weight: 800;
    color: #fff;
    letter-spacing: 1px;
  }

  .header-logo h1 span { color: #e94560; }

  .header-right {
    display: flex;
    align-items: center;
    gap: 28px;
  }

  #uhrzeit {
    font-size: 2.2rem;
    font-weight: 800;
    color: #fff;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
  }

  .refresh-wrap {
    text-align: right;
  }

  #datum {
    font-size: 1rem;
    color: #9ca3af;
  }

  #refresh-info {
    font-size: 0.85rem;
    color: #6b7280;
  }

  .admin-link {
    background: #374151;
    color: #d1d5db;
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    transition: background 0.2s;
  }

  .admin-link:hover { background: #e94560; color: #fff; }

  /* ── LEGENDE ── */
  .legende-bar {
    background: #1f2937;
    padding: 10px 36px;
    display: flex;
    gap: 28px;
    align-items: center;
    border-bottom: 1px solid #374151;
    flex-wrap: wrap;
  }

  .legende-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.88rem;
    color: #9ca3af;
  }

  .legende-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ── TABELLE ── */
  main { padding: 24px 36px; }

  .table-wrap {
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: #1f2937;
  }

  thead tr {
    background: #111827;
    border-bottom: 2px solid #374151;
  }

  th {
    padding: 14px 20px;
    font-size: 0.78rem;
    font-weight: 700;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    text-align: left;
    white-space: nowrap;
  }

  th.right { text-align: right; }

  /* Datenzeilen */
  tbody tr {
    border-bottom: 1px solid #374151;
    transition: background 0.15s;
  }

  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.03); }

  td {
    padding: 0;
    vertical-align: middle;
  }

  /* Farbstreifen links */
  .stripe-cell {
    width: 10px;
    padding: 0 !important;
  }

  .stripe {
    width: 10px;
    height: 100%;
    min-height: 80px;
    display: block;
  }

  .stripe.gruen    { background: #16a34a; }
  .stripe.orange   { background: #ea580c; }
  .stripe.rot      { background: #dc2626; }
  .stripe.geplant  { background: #2563eb; }
  .stripe.pausiert { background: #7c3aed; }

  /* Inhalt-Zellen */
  .td-inner {
    padding: 18px 20px;
  }

  /* Auftragsnummer */
  .auftrag-nr {
    font-size: 1rem;
    font-weight: 700;
    color: #9ca3af;
    letter-spacing: 0.5px;
  }

  /* Kundenname – groß und prominent */
  .kunde-name {
    font-size: 1.5rem;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.2;
    margin-top: 3px;
  }

  /* Beschreibung */
  .beschreibung {
    font-size: 0.95rem;
    color: #9ca3af;
    margin-top: 4px;
    line-height: 1.3;
  }

  /* Mitarbeiter-Badges */
  .ma-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }

  .ma-badge {
    background: #374151;
    color: #d1d5db;
    border-radius: 20px;
    padding: 3px 12px;
    font-size: 0.85rem;
    font-weight: 600;
    white-space: nowrap;
  }

  /* Status-Badge */
  .status-badge {
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  .badge-gruen    { background: rgba(22,163,74,0.2);   color: #4ade80; border: 1px solid #16a34a; }
  .badge-orange   { background: rgba(234,88,12,0.2);   color: #fb923c; border: 1px solid #ea580c; }
  .badge-rot      { background: rgba(220,38,38,0.2);   color: #f87171; border: 1px solid #dc2626; }
  .badge-geplant  { background: rgba(37,99,235,0.2);   color: #93c5fd; border: 1px solid #2563eb; }
  .badge-pausiert { background: rgba(124,58,237,0.2);  color: #c4b5fd; border: 1px solid #7c3aed; }

  /* Zeitwerte */
  .zeit-wert {
    font-size: 1.3rem;
    font-weight: 800;
    color: #f9fafb;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .zeit-label {
    font-size: 0.75rem;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 3px;
  }

  .zeit-ueberzogen {
    color: #f87171 !important;
  }

  /* Progressbar */
  .progress-wrap {
    min-width: 140px;
  }

  .progress-bg {
    background: #374151;
    border-radius: 8px;
    height: 12px;
    overflow: hidden;
    margin-top: 6px;
  }

  .progress-fill {
    height: 100%;
    border-radius: 8px;
    transition: width 1s;
  }

  .fill-gruen    { background: linear-gradient(90deg, #16a34a, #4ade80); }
  .fill-orange   { background: linear-gradient(90deg, #ea580c, #fb923c); }
  .fill-rot      { background: linear-gradient(90deg, #dc2626, #f87171); }
  .fill-geplant  { background: #2563eb; }
  .fill-pausiert { background: #7c3aed; }

  .pct-text {
    font-size: 0.82rem;
    color: #9ca3af;
    margin-top: 4px;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .blink { animation: blink 1s infinite; }

  /* Leer-Meldung */
  .leer {
    text-align: center;
    padding: 80px 20px;
    color: #4b5563;
  }

  .leer-icon { font-size: 3.5rem; margin-bottom: 16px; }
  .leer-text { font-size: 1.2rem; }

  /* Notiz */
  .notiz {
    background: #111827;
    border-left: 4px solid #374151;
    border-radius: 4px;
    padding: 6px 12px;
    font-size: 0.88rem;
    color: #9ca3af;
    margin-top: 6px;
  }

  /* Geplant-Info */
  .geplant-info {
    font-size: 0.9rem;
    color: #93c5fd;
    margin-top: 4px;
  }
</style>
</head>
<body>

<header>
  <div class="header-logo">
    <h1>Sevinc <span>Metallbau</span></h1>
    <span style="color:#4b5563;font-size:1.4rem">|</span>
    <span style="font-size:1.2rem;color:#9ca3af;font-weight:600">Auftragsübersicht</span>
  </div>
  <div class="header-right">
    <div class="refresh-wrap">
      <div id="datum"></div>
      <div id="refresh-info">Aktualisierung in <span id="countdown">30</span>s</div>
    </div>
    <div id="uhrzeit">--:--</div>
    <a href="admin.html" class="admin-link">Admin</a>
  </div>
</header>

<div class="legende-bar">
  <div class="legende-item"><div class="legende-dot" style="background:#2563eb"></div>Geplant – noch nicht gestartet</div>
  <div class="legende-item"><div class="legende-dot" style="background:#16a34a"></div>Im Zeitplan</div>
  <div class="legende-item"><div class="legende-dot" style="background:#ea580c"></div>Fast abgelaufen (≥75%)</div>
  <div class="legende-item"><div class="legende-dot" style="background:#dc2626"></div>Zeit überschritten</div>
  <div class="legende-item"><div class="legende-dot" style="background:#7c3aed"></div>Pausiert</div>
</div>

<main>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th></th>
          <th>Auftrag / Kunde</th>
          <th>Mitarbeiter</th>
          <th>Status</th>
          <th>Geplant</th>
          <th>Laufzeit</th>
          <th class="right">Restzeit</th>
          <th>Fortschritt</th>
        </tr>
      </thead>
      <tbody id="auftrag-tbody">
        <tr><td colspan="8"><div class="leer"><div class="leer-icon">⏳</div><div class="leer-text">Lade Aufträge…</div></div></td></tr>
      </tbody>
    </table>
  </div>
</main>

<script>
const SUPABASE_URL = 'https://febvatualuantefwlqyq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZlYnZhdHVhbHVhbnRlZndscXlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1NDcyMzUsImV4cCI6MjA5MDEyMzIzNX0.kK8cfkl3FXRxeDi1vZUNaRFf4-eIsi0TrFAvXDvUujc';

let countdownVal = 30;

// ── Uhr ──
function tickClock() {
  const now = new Date();
  document.getElementById('uhrzeit').textContent =
    now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  document.getElementById('datum').textContent =
    now.toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
}
setInterval(tickClock, 1000);
tickClock();

// ── Countdown ──
setInterval(() => {
  countdownVal--;
  document.getElementById('countdown').textContent = countdownVal;
  if (countdownVal <= 0) { countdownVal = 30; ladeAuftraege(); }
}, 1000);

// ── Zeitberechnung ──
function getElapsedHours(a) {
  if (!a.startzeit) return 0;
  const start = new Date(a.startzeit);
  const ref = (a.status === 'pausiert' && a.pausiert_seit)
    ? new Date(a.pausiert_seit) : new Date();
  return Math.max(0, (ref - start) / 3600000 - (a.pause_gesamt || 0));
}

function getStatusClass(a) {
  if (a.status === 'geplant' || !a.startzeit) return 'geplant';
  if (a.status === 'pausiert') return 'pausiert';
  const pct = getElapsedHours(a) / a.geplante_stunden;
  if (pct >= 1) return 'rot';
  if (pct >= 0.75) return 'orange';
  return 'gruen';
}

function formatDauer(h) {
  if (h <= 0) h = 0;
  const hh = Math.floor(h);
  const mm = Math.round((h - hh) * 60);
  if (hh === 0) return `${mm} Min`;
  if (mm === 0) return `${hh} Std`;
  return `${hh} Std ${mm} Min`;
}

function formatDatum(iso) {
  if (!iso) return '–';
  return new Date(iso).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function formatDatetime(iso) {
  if (!iso) return '–';
  return new Date(iso).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

// ── Daten laden ──
async function ladeAuftraege() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/auftraege?status=in.(aktiv,pausiert,geplant)&order=created_at.asc`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
    );
    render(await res.json());
  } catch(e) {
    document.getElementById('auftrag-tbody').innerHTML =
      '<tr><td colspan="8"><div class="leer"><div class="leer-icon">⚠️</div><div class="leer-text">Verbindungsfehler – Seite neu laden</div></div></td></tr>';
  }
}

// ── Render ──
function render(daten) {
  const tbody = document.getElementById('auftrag-tbody');

  if (!daten || daten.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8"><div class="leer"><div class="leer-icon">✅</div><div class="leer-text">Keine aktiven Aufträge</div></div></td></tr>';
    return;
  }

  tbody.innerHTML = daten.map(a => {
    const st = getStatusClass(a);
    const elapsed = getElapsedHours(a);
    const pct = a.startzeit ? Math.min((elapsed / a.geplante_stunden) * 100, 100) : 0;
    const rest = a.geplante_stunden - elapsed;
    const ueberzogen = rest < 0 && a.startzeit && a.status !== 'geplant';

    const badgeText = { gruen:'Im Plan', orange:'Bald fällig', rot:'Überzogen', geplant:'Geplant', pausiert:'Pausiert' }[st] || '';

    // Geplant-Spalte
    const geplantZelle = a.planung_typ === 'tage'
      ? `<div class="zeit-label">Bis Datum</div><div class="zeit-wert" style="font-size:1.1rem">📅 ${formatDatum(a.zieldatum)}</div>`
      : `<div class="zeit-label">Geplant</div><div class="zeit-wert">${formatDauer(a.geplante_stunden)}</div>`;

    // Laufzeit
    const laufzeitZelle = a.startzeit
      ? `<div class="zeit-label">Laufzeit</div><div class="zeit-wert">${formatDauer(elapsed)}${a.status==='pausiert' ? ' <span style="color:#c4b5fd;font-size:0.8rem">⏸</span>' : ''}</div>`
      : `<div class="zeit-label">Laufzeit</div><div class="zeit-wert" style="color:#4b5563">–</div>`;

    // Restzeit
    let restZelle;
    if (!a.startzeit || a.status === 'geplant') {
      restZelle = `<div class="zeit-label">Restzeit</div><div class="zeit-wert" style="color:#4b5563">–</div>`;
    } else if (ueberzogen) {
      restZelle = `<div class="zeit-label">Überzogen</div><div class="zeit-wert zeit-ueberzogen blink">+${formatDauer(Math.abs(rest))}</div>`;
    } else {
      restZelle = `<div class="zeit-label">Restzeit</div><div class="zeit-wert">${formatDauer(rest)}</div>`;
    }

    // Mitarbeiter
    const mitarbeiter = (a.mitarbeiter && a.mitarbeiter.length)
      ? a.mitarbeiter.map(m => `<span class="ma-badge">${m}</span>`).join('')
      : '<span style="color:#4b5563">–</span>';

    return `<tr>
      <td class="stripe-cell"><div class="stripe ${st}"></div></td>
      <td>
        <div class="td-inner">
          <div class="auftrag-nr">${a.auftragsnummer || ''}</div>
          <div class="kunde-name">${a.kunde || '–'}</div>
          ${a.beschreibung ? `<div class="beschreibung">${a.beschreibung}</div>` : ''}
          ${a.status === 'geplant' ? `<div class="geplant-info">🕐 Noch nicht gestartet</div>` : ''}
          ${a.notiz ? `<div class="notiz">📝 ${a.notiz}</div>` : ''}
        </div>
      </td>
      <td>
        <div class="td-inner">
          <div class="ma-badges">${mitarbeiter}</div>
        </div>
      </td>
      <td>
        <div class="td-inner">
          <span class="status-badge badge-${st}">${badgeText}</span>
          ${a.startzeit && a.status === 'aktiv' ? `<div style="font-size:0.8rem;color:#6b7280;margin-top:6px">Start: ${formatDatetime(a.startzeit)}</div>` : ''}
        </div>
      </td>
      <td><div class="td-inner">${geplantZelle}</div></td>
      <td><div class="td-inner">${laufzeitZelle}</div></td>
      <td><div class="td-inner" style="text-align:right">${restZelle}</div></td>
      <td>
        <div class="td-inner">
          <div class="progress-wrap">
            <div class="pct-text">${a.startzeit ? Math.round(pct) + '%' : '–'}</div>
            <div class="progress-bg">
              <div class="progress-fill fill-${st}" style="width:${pct}%"></div>
            </div>
          </div>
        </div>
      </td>
    </tr>`;
  }).join('');
}

ladeAuftraege();
</script>
</body>
</html>
