<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auftragsübersicht – Sevinc Metallbau</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    min-height: 100vh;
  }

  header {
    background: #16213e;
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 3px solid #0f3460;
    box-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }

  header h1 {
    font-size: 1.6rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
  }

  header h1 span {
    color: #e94560;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  #uhrzeit {
    font-size: 1.4rem;
    font-weight: 700;
    color: #fff;
    background: #0f3460;
    padding: 6px 14px;
    border-radius: 8px;
  }

  #refresh-info {
    font-size: 0.78rem;
    color: #aaa;
    text-align: right;
  }

  .admin-link {
    background: #0f3460;
    color: #e0e0e0;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.85rem;
    transition: background 0.2s;
  }

  .admin-link:hover { background: #e94560; color: #fff; }

  main {
    padding: 24px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .legende {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .legende-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: #bbb;
  }

  .legende-farbe {
    width: 16px;
    height: 16px;
    border-radius: 4px;
  }

  .legende-farbe.gruen { background: #28a745; }
  .legende-farbe.orange { background: #fd7e14; }
  .legende-farbe.rot { background: #dc3545; }

  .auftraege-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 20px;
  }

  .auftrag-card {
    background: #16213e;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    transition: transform 0.15s;
  }

  .auftrag-card:hover { transform: translateY(-2px); }

  .status-stripe {
    width: 8px;
    flex-shrink: 0;
    border-radius: 0;
  }

  .status-stripe.gruen    { background: #28a745; }
  .status-stripe.orange   { background: #fd7e14; }
  .status-stripe.rot      { background: #dc3545; }
  .status-stripe.neutral  { background: #555; }
  .status-stripe.geplant  { background: #3d8bcd; }
  .status-stripe.pausiert { background: #9b59b6; }

  .card-body {
    padding: 16px 18px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }

  .auftrag-nr {
    font-size: 1.2rem;
    font-weight: 700;
    color: #fff;
  }

  .status-badge {
    font-size: 0.72rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  .badge-gruen    { background: rgba(40,167,69,0.2);  color: #5cb85c; border: 1px solid #28a745; }
  .badge-orange   { background: rgba(253,126,20,0.2); color: #fd7e14; border: 1px solid #fd7e14; }
  .badge-rot      { background: rgba(220,53,69,0.2);  color: #f55; border: 1px solid #dc3545; }
  .badge-neutral  { background: rgba(100,100,100,0.2); color: #aaa; border: 1px solid #555; }
  .badge-geplant  { background: rgba(61,139,205,0.2); color: #7dc3ff; border: 1px solid #3d8bcd; }
  .badge-pausiert { background: rgba(155,89,182,0.2); color: #c39bd3; border: 1px solid #9b59b6; }

  .kunde {
    font-size: 1rem;
    font-weight: 600;
    color: #c8d6e5;
  }

  .beschreibung {
    font-size: 0.88rem;
    color: #aaa;
    line-height: 1.4;
  }

  .card-info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 12px;
    margin-top: 4px;
  }

  .info-item {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .info-label {
    font-size: 0.7rem;
    color: #777;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .info-value {
    font-size: 0.9rem;
    color: #ddd;
    font-weight: 500;
  }

  .zeit-ueberzogen {
    color: #f55 !important;
    font-weight: 700;
  }

  .progress-wrap {
    margin-top: 6px;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
    color: #888;
    margin-bottom: 4px;
  }

  .progress-bar-bg {
    background: #0f1e3d;
    border-radius: 6px;
    height: 10px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    border-radius: 6px;
    transition: width 0.5s;
  }

  .fill-gruen  { background: linear-gradient(90deg, #28a745, #5cb85c); }
  .fill-orange { background: linear-gradient(90deg, #fd7e14, #ffa040); }
  .fill-rot    { background: linear-gradient(90deg, #dc3545, #ff6b6b); }

  .notiz-box {
    background: #0f1e3d;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 0.82rem;
    color: #aaa;
    border-left: 3px solid #0f3460;
    margin-top: 2px;
  }

  .leer-meldung {
    grid-column: 1 / -1;
    text-align: center;
    color: #555;
    font-size: 1.1rem;
    padding: 60px 20px;
    border: 2px dashed #2a2a4a;
    border-radius: 12px;
  }

  .leer-meldung span {
    font-size: 2.5rem;
    display: block;
    margin-bottom: 12px;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .blink { animation: pulse 1.2s infinite; }

  @media (max-width: 600px) {
    header h1 { font-size: 1.1rem; }
    main { padding: 14px; }
    .auftraege-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>Sevinc <span>Metallbau</span> – Auftragsübersicht</h1>
  <div class="header-right">
    <div>
      <div id="uhrzeit">--:--</div>
      <div id="refresh-info">Aktualisierung in <span id="countdown">30</span>s</div>
    </div>
    <a href="admin.html" class="admin-link">Admin</a>
  </div>
</header>

<main>
  <div class="legende">
    <div class="legende-item"><div class="legende-farbe" style="background:#3d8bcd"></div> Geplant – noch nicht gestartet</div>
    <div class="legende-item"><div class="legende-farbe gruen"></div> Im Zeitplan</div>
    <div class="legende-item"><div class="legende-farbe orange"></div> Fast abgelaufen (&ge;75%)</div>
    <div class="legende-item"><div class="legende-farbe rot"></div> Zeit überschritten</div>
    <div class="legende-item"><div class="legende-farbe" style="background:#9b59b6"></div> Pausiert</div>
  </div>

  <div class="auftraege-grid" id="auftraege-grid">
    <div class="leer-meldung"><span>⏳</span>Lade Aufträge…</div>
  </div>
</main>

<script>
const SUPABASE_URL = 'https://febvatualuantefwlqyq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZlYnZhdHVhbHVhbnRlZndscXlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1NDcyMzUsImV4cCI6MjA5MDEyMzIzNX0.kK8cfkl3FXRxeDi1vZUNaRFf4-eIsi0TrFAvXDvUujc';

let countdownVal = 30;

// Uhrzeit
function tickClock() {
  const now = new Date();
  document.getElementById('uhrzeit').textContent =
    now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
setInterval(tickClock, 1000);
tickClock();

// Countdown
function tickCountdown() {
  countdownVal--;
  document.getElementById('countdown').textContent = countdownVal;
  if (countdownVal <= 0) {
    countdownVal = 30;
    ladeAuftraege();
  }
}
setInterval(tickCountdown, 1000);

async function ladeAuftraege() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/auftraege?status=in.(aktiv,pausiert,geplant)&order=created_at.asc`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
    );
    const daten = await res.json();
    renderAuftraege(daten);
  } catch(e) {
    document.getElementById('auftraege-grid').innerHTML =
      '<div class="leer-meldung"><span>⚠️</span>Verbindungsfehler – bitte Seite neu laden</div>';
  }
}

function getElapsedHours(a) {
  if (!a.startzeit) return 0;
  const start = new Date(a.startzeit);
  const ref = (a.status === 'pausiert' && a.pausiert_seit)
    ? new Date(a.pausiert_seit) : new Date();
  return Math.max(0, (ref - start) / 3600000 - (a.pause_gesamt || 0));
}

function getStatusClass(a) {
  if (a.status === 'geplant' || !a.startzeit) return 'geplant';
  if (a.status === 'pausiert') return 'pausiert';
  const pct = getElapsedHours(a) / a.geplante_stunden;
  if (pct >= 1) return 'rot';
  if (pct >= 0.75) return 'orange';
  return 'gruen';
}

function formatDauer(stunden) {
  if (stunden < 0) stunden = Math.abs(stunden);
  const h = Math.floor(stunden);
  const m = Math.round((stunden - h) * 60);
  if (h === 0) return `${m} Min`;
  if (m === 0) return `${h} Std`;
  return `${h} Std ${m} Min`;
}

function formatDatetime(iso) {
  if (!iso) return '–';
  const d = new Date(iso);
  return d.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function renderAuftraege(daten) {
  const grid = document.getElementById('auftraege-grid');

  if (!daten || daten.length === 0) {
    grid.innerHTML = '<div class="leer-meldung"><span>✅</span>Keine aktiven Aufträge</div>';
    return;
  }

  grid.innerHTML = daten.map(a => {
    const status = getStatusClass(a);
    const elapsed = getElapsedHours(a);
    const pct = a.startzeit ? Math.min((elapsed / a.geplante_stunden) * 100, 100) : 0;
    const restStunden = a.geplante_stunden - elapsed;
    const ueberzogen = restStunden < 0 && a.startzeit;

    const badgeText = status === 'rot' ? 'Überzogen'
      : status === 'orange' ? 'Bald fällig'
      : status === 'gruen' ? 'Im Plan'
      : status === 'geplant' ? 'Geplant'
      : status === 'pausiert' ? 'Pausiert'
      : 'Kein Start';
    const badgeClass = `badge-${status}`;

    const restAnzeige = ueberzogen
      ? `<span class="info-value zeit-ueberzogen blink">+${formatDauer(Math.abs(restStunden))} über</span>`
      : `<span class="info-value">${a.startzeit ? formatDauer(restStunden) : '–'}</span>`;

    const laufzeit = a.startzeit ? formatDauer(elapsed) : '–';

    return `
    <div class="auftrag-card">
      <div class="status-stripe ${status}"></div>
      <div class="card-body">
        <div class="card-header">
          <div class="auftrag-nr">${a.auftragsnummer || 'Nr. –'}</div>
          <div class="status-badge ${badgeClass}">${badgeText}</div>
        </div>
        ${a.kunde ? `<div class="kunde">${a.kunde}</div>` : ''}
        ${a.beschreibung ? `<div class="beschreibung">${a.beschreibung}</div>` : ''}
        <div class="card-info">
          <div class="info-item">
            <span class="info-label">Mitarbeiter</span>
            <span class="info-value">${(a.mitarbeiter && a.mitarbeiter.length) ? a.mitarbeiter.join(', ') : '–'}</span>
          </div>
          <div class="info-item">
            <span class="info-label">Gestartet</span>
            <span class="info-value">${formatDatetime(a.startzeit)}</span>
          </div>
          <div class="info-item">
            <span class="info-label">Geplant</span>
            <span class="info-value">${a.planung_typ === 'tage' ? '📅 ' + formatDatetime(a.zieldatum).split(',')[0] : formatDauer(a.geplante_stunden)}</span>
          </div>
          <div class="info-item">
            <span class="info-label">Laufzeit</span>
            <span class="info-value">${laufzeit}</span>
          </div>
          <div class="info-item">
            <span class="info-label">Restzeit</span>
            ${restAnzeige}
          </div>
        </div>
        ${a.startzeit ? `
        <div class="progress-wrap">
          <div class="progress-label">
            <span>${Math.round((elapsed / a.geplante_stunden) * 100)}% verbraucht</span>
            ${ueberzogen ? '<span style="color:#f55">ÜBERZOGEN</span>' : ''}
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill fill-${status}" style="width:${pct}%"></div>
          </div>
        </div>` : ''}
        ${a.notiz ? `<div class="notiz-box">📝 ${a.notiz}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

// Start
ladeAuftraege();
</script>
</body>
</html>
