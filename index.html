<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Auftragsübersicht – Sevinc Metallbau</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #111827;
    color: #e5e7eb;
    height: 100vh;
    overflow: hidden;
  }

  /* ── HEADER ── */
  header {
    background: #1f2937;
    border-bottom: 4px solid #e94560;
    padding: 16px 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header-logo {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .header-logo h1 {
    font-size: 1.8rem;
    font-weight: 800;
    color: #fff;
    letter-spacing: 1px;
  }

  .header-logo h1 span { color: #fff; }

  .header-right {
    display: flex;
    align-items: center;
    gap: 28px;
  }

  #uhrzeit {
    font-size: 2.2rem;
    font-weight: 800;
    color: #fff;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
  }

  .refresh-wrap {
    text-align: right;
  }

  #datum {
    font-size: 1rem;
    color: #9ca3af;
  }

  #refresh-info {
    font-size: 0.85rem;
    color: #6b7280;
  }

  .admin-link {
    background: #374151;
    color: #d1d5db;
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    transition: background 0.2s;
  }

  .admin-link:hover { background: #e94560; color: #fff; }

  /* ── LEGENDE ── */
  .legende-bar {
    background: #1f2937;
    padding: 10px 36px;
    display: flex;
    gap: 28px;
    align-items: center;
    border-bottom: 1px solid #374151;
    flex-wrap: wrap;
  }

  .legende-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.88rem;
    color: #9ca3af;
  }

  .legende-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ── TABELLE ── */
  main {
    padding: 24px 36px;
    flex: 1;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  .table-wrap {
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: #1f2937;
  }

  thead tr {
    background: linear-gradient(90deg, #1e3a5f, #1f2937);
    border-bottom: 3px solid #e94560;
  }

  th {
    padding: 18px 20px;
    font-size: 1.15rem;
    font-weight: 800;
    color: #e2e8f0;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    text-align: left;
    white-space: nowrap;
  }

  th.right { text-align: right; }

  /* Datenzeilen */
  tbody tr {
    border-bottom: 1px solid #374151;
    transition: background 0.15s;
  }

  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.03); }

  td {
    padding: 0;
    vertical-align: middle;
  }

  /* Farbstreifen links */
  .stripe-cell {
    width: 10px;
    padding: 0 !important;
  }

  .stripe {
    width: 10px;
    height: 100%;
    min-height: 80px;
    display: block;
  }

  .stripe.gruen    { background: #16a34a; }
  .stripe.orange   { background: #ea580c; }
  .stripe.rot      { background: #dc2626; }
  .stripe.geplant  { background: #2563eb; }
  .stripe.pausiert { background: #7c3aed; }

  /* Inhalt-Zellen */
  .td-inner {
    padding: 18px 20px;
  }

  /* Auftragsnummer */
  .auftrag-nr {
    font-size: 1rem;
    font-weight: 700;
    color: #9ca3af;
    letter-spacing: 0.5px;
  }

  /* Kundenname – groß und prominent */
  .kunde-name {
    font-size: 1.5rem;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.2;
    margin-top: 3px;
  }

  /* Beschreibung */
  .beschreibung {
    font-size: 0.95rem;
    color: #9ca3af;
    margin-top: 4px;
    line-height: 1.3;
  }

  /* Mitarbeiter-Badges */
  .ma-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }

  .ma-badge {
    background: #374151;
    color: #d1d5db;
    border-radius: 20px;
    padding: 3px 12px;
    font-size: 0.85rem;
    font-weight: 600;
    white-space: nowrap;
  }

  /* Status-Badge */
  .status-badge {
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  .badge-gruen    { background: rgba(22,163,74,0.2);   color: #ffffff; border: 1px solid #16a34a; }
  .badge-orange   { background: rgba(234,88,12,0.2);   color: #fb923c; border: 1px solid #ea580c; }
  .badge-rot      { background: rgba(220,38,38,0.2);   color: #f87171; border: 1px solid #dc2626; }
  .badge-geplant  { background: rgba(37,99,235,0.2);   color: #ffffff; border: 1px solid #2563eb; }
  .badge-pausiert { background: rgba(124,58,237,0.2);  color: #ffffff; border: 1px solid #7c3aed; }

  /* Zeitwerte */
  .zeit-wert {
    font-size: 1.3rem;
    font-weight: 800;
    color: #f9fafb;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* Große Zeitwerte für Laufzeit & Restzeit */
  .zeit-wert-gross {
    font-size: 2rem;
    font-weight: 800;
    color: #f9fafb;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    line-height: 1.1;
  }

  tr.row-klein .zeit-wert-gross { font-size: 1.4rem; }

  .zeit-label {
    font-size: 0.75rem;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 3px;
  }

  .zeit-ueberzogen {
    color: #f87171 !important;
  }

  /* Progressbar */
  .progress-wrap {
    min-width: 140px;
  }

  .progress-bg {
    background: #374151;
    border-radius: 8px;
    height: 12px;
    overflow: hidden;
    margin-top: 6px;
  }

  .progress-fill {
    height: 100%;
    border-radius: 8px;
    transition: width 1s;
  }

  .fill-gruen    { background: linear-gradient(90deg, #16a34a, #4ade80); }
  .fill-orange   { background: linear-gradient(90deg, #ea580c, #fb923c); }
  .fill-rot      { background: linear-gradient(90deg, #dc2626, #f87171); }
  .fill-geplant  { background: #2563eb; }
  .fill-pausiert { background: #7c3aed; }

  .pct-text {
    font-size: 0.82rem;
    color: #9ca3af;
    margin-top: 4px;
  }

  /* ── Mobile ── */
  @media (max-width: 767px) {
    header { padding: 12px 16px; }
    header .header-logo h1 { font-size: 1.2rem; }
    #uhrzeit { font-size: 1.5rem; }
    .legende-bar { display: none; }
    main { padding: 12px; }
    .table-wrap { border-radius: 10px; }

    /* Tabelle → Cards auf Handy */
    thead { display: none; }

    tbody tr {
      display: block;
      border-radius: 10px;
      margin-bottom: 10px;
      border: 1px solid #374151;
      overflow: hidden;
      position: relative;
    }

    tbody tr.row-klein { opacity: 0.7; }

    td { display: block; padding: 0; }

    .stripe-cell {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 8px !important;
    }

    .stripe { min-height: unset; height: 100% !important; }

    /* Hauptinhalt-Zelle */
    td:nth-child(2) .td-inner { padding: 14px 14px 10px 20px; }

    /* Alle anderen Zellen ausblenden außer Hauptinhalt + Restzeit */
    td:nth-child(3),
    td:nth-child(4),
    td:nth-child(5),
    td:nth-child(6),
    td:nth-child(8) { display: none; }

    /* Restzeit kompakt unten */
    td:nth-child(7) .td-inner {
      padding: 0 14px 14px 20px;
      text-align: left !important;
    }

    .kunde-name { font-size: 1.2rem; }
    .auftrag-nr { font-size: 0.85rem; }
    .zeit-wert { font-size: 1rem; }

    .ma-badges { margin-top: 4px; }
    .ma-badge { font-size: 0.78rem; padding: 2px 9px; }

    /* Mitarbeiter in der Hauptzelle anzeigen */
    td:nth-child(2) .td-inner::after { content: ''; }
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .blink { animation: blink 1s infinite; }

  /* Leer-Meldung */
  .leer {
    text-align: center;
    padding: 80px 20px;
    color: #4b5563;
  }

  .leer-icon { font-size: 3.5rem; margin-bottom: 16px; }
  .leer-text { font-size: 1.2rem; }

  /* Kleinere Zeilen für nicht-laufende Aufträge */
  tr.row-klein td { opacity: 0.65; }
  tr.row-klein .kunde-name { font-size: 1.1rem; }
  tr.row-klein .td-inner { padding: 10px 20px; }
  tr.row-klein .stripe { min-height: 56px; }
  tr.row-klein .zeit-wert { font-size: 1rem; }
  tr.row-klein .ma-badge { font-size: 0.78rem; padding: 2px 9px; }

  /* Notiz */
  .notiz {
    background: #111827;
    border-left: 4px solid #374151;
    border-radius: 4px;
    padding: 6px 12px;
    font-size: 0.88rem;
    color: #9ca3af;
    margin-top: 6px;
  }

  /* Geplant-Info */
  .geplant-info {
    font-size: 0.9rem;
    color: #93c5fd;
    margin-top: 4px;
  }
</style>
</head>
<body>

<header>
  <div class="header-logo">
    <h1>Sevinc <span>Metallbau</span></h1>
    <span style="color:#4b5563;font-size:1.4rem">|</span>
    <span style="font-size:1.2rem;color:#9ca3af;font-weight:600">Auftragsübersicht</span>
  </div>
  <div class="header-right">
    <div class="refresh-wrap">
      <div id="datum"></div>
      <div id="refresh-info">Aktualisierung in <span id="countdown">30</span>s</div>
    </div>
    <div id="uhrzeit">--:--</div>
    <a href="admin.html" class="admin-link">Admin</a>
  </div>
</header>

<div class="legende-bar">
  <div class="legende-item"><div class="legende-dot" style="background:#2563eb"></div>Geplant – noch nicht gestartet</div>
  <div class="legende-item"><div class="legende-dot" style="background:#16a34a"></div>Im Zeitplan</div>
  <div class="legende-item"><div class="legende-dot" style="background:#ea580c"></div>Bald fällig / Bald starten</div>
  <div class="legende-item"><div class="legende-dot" style="background:#dc2626"></div>Überzogen / Überfällig</div>
  <div class="legende-item"><div class="legende-dot" style="background:#7c3aed"></div>Pausiert</div>
</div>

<main>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th></th>
          <th>Auftrag / Kunde</th>
          <th>Status</th>
          <th>Fertigstellung</th>
          <th>Laufzeit</th>
          <th class="right">Restzeit</th>
          <th>Fortschritt</th>
        </tr>
      </thead>
      <tbody id="auftrag-tbody">
        <tr><td colspan="7"><div class="leer"><div class="leer-icon">⏳</div><div class="leer-text">Lade Aufträge…</div></div></td></tr>
      </tbody>
    </table>
  </div>
</main>

<script>
const SUPABASE_URL = 'https://febvatualuantefwlqyq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZlYnZhdHVhbHVhbnRlZndscXlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1NDcyMzUsImV4cCI6MjA5MDEyMzIzNX0.kK8cfkl3FXRxeDi1vZUNaRFf4-eIsi0TrFAvXDvUujc';

let countdownVal = 30;
let letzterErfolg = true;
let retryCount = 0;

// ── Uhr ──
function tickClock() {
  const now = new Date();
  document.getElementById('uhrzeit').textContent =
    now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  document.getElementById('datum').textContent =
    now.toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
}
setInterval(tickClock, 1000);
tickClock();

// ── Countdown ──
setInterval(() => {
  countdownVal--;
  document.getElementById('countdown').textContent = countdownVal;
  if (countdownVal <= 0) { countdownVal = 30; ladeAuftraege(); }
}, 1000);

// ── Zeitberechnung ──
function getElapsedHours(a) {
  if (!a.startzeit) return 0;
  const start = new Date(a.startzeit);
  const ref = (a.status === 'pausiert' && a.pausiert_seit)
    ? new Date(a.pausiert_seit) : new Date();
  let count = 0;
  const d = new Date(start);
  d.setHours(0,0,0,0);
  const end = new Date(ref);
  end.setHours(0,0,0,0);
  while (d <= end) {
    const tag = d.getDay();
    if (tag !== 0 && tag !== 6) count++;
    d.setDate(d.getDate() + 1);
  }
  return Math.max(0, count * 8 - (a.pause_gesamt || 0));
}

function werktageZwischen(von, bis) {
  let count = 0;
  const d = new Date(von);
  d.setHours(0,0,0,0);
  const end = new Date(bis);
  end.setHours(0,0,0,0);
  while (d < end) {
    const tag = d.getDay();
    if (tag !== 0 && tag !== 6) count++;
    d.setDate(d.getDate() + 1);
  }
  return count;
}

function getGeplantDringlichkeit(a) {
  // Für geplante Aufträge: Restwerktage vs. Produktionstage vergleichen
  if (!a.zieldatum) return 0;
  const ziel = new Date(a.zieldatum);
  const jetzt = new Date();

  // Zieldatum überschritten → rot
  if (jetzt > ziel) return 2;

  // Restwerktage bis Zieldatum zählen (Mo-Fr)
  const restWerktage = werktageZwischen(jetzt, ziel);

  // Produktionstage aus geplante_stunden (Stunden / 8 = Werktage)
  const produktionstage = a.geplante_stunden ? a.geplante_stunden / 8 : 0;

  if (produktionstage > 0) {
    // Nicht genug Werktage für die Produktion → rot
    if (restWerktage < produktionstage) return 1;
    // Wird knapp (weniger als 50% Puffer) → orange
    if (restWerktage < produktionstage * 1.5) return 0.8;
  }

  return 0;
}

function getStatusClass(a) {
  if (a.status === 'geplant' || !a.startzeit) {
    // Dringlichkeits-Check für geplante Aufträge
    const dring = getGeplantDringlichkeit(a);
    if (dring >= 1) return 'rot';
    if (dring >= 0.75) return 'orange';
    return 'geplant';
  }
  if (a.status === 'pausiert') return 'pausiert';
  const pct = getElapsedHours(a) / a.geplante_stunden;
  if (pct >= 1) return 'rot';
  if (pct >= 0.75) return 'orange';
  return 'gruen';
}

function formatDauer(h) {
  if (h < 0) h = Math.abs(h);
  const totalMin = Math.round(h * 60);
  const d = Math.floor(totalMin / (8 * 60));
  const rest = totalMin - d * 8 * 60;
  const hh = Math.floor(rest / 60);
  const mm = rest % 60;
  const parts = [];
  if (d > 0) parts.push(`${d} T`);
  if (hh > 0) parts.push(`${hh} Std`);
  if (mm > 0 || parts.length === 0) parts.push(`${mm} Min`);
  return parts.join(' ');
}

function formatDatum(iso) {
  if (!iso) return '–';
  return new Date(iso).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function formatDatetime(iso) {
  if (!iso) return '–';
  return new Date(iso).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

// ── Daten laden ──
async function ladeAuftraege() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/auftraege?status=in.(aktiv,pausiert,geplant)&order=created_at.asc`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
    );
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const daten = (await res.json()).sort((a, b) => {
      function sortPrio(x) {
        if (x.status === 'aktiv') return 0;
        if ((x.status === 'geplant' || !x.startzeit) && x.zieldatum) {
          const d = getGeplantDringlichkeit(x);
          if (d >= 1) return 1;    // Dringend rot
          if (d >= 0.75) return 2;  // Dringend orange
        }
        if (x.status === 'pausiert') return 3;
        if ((x.status === 'geplant' || !x.startzeit) && x.zieldatum) return 4; // Geplant mit Termin
        return 5; // Geplant ohne Termin
      }
      const prio = sortPrio(a) - sortPrio(b);
      if (prio !== 0) return prio;
      // Bei gleicher Priorität: nächster Termin zuerst
      const zA = a.zieldatum ? new Date(a.zieldatum).getTime() : Infinity;
      const zB = b.zieldatum ? new Date(b.zieldatum).getTime() : Infinity;
      return zA - zB;
    });
    retryCount = 0;
    letzterErfolg = true;
    render(daten);
  } catch(e) {
    // Bei Fehler: alte Daten stehen lassen, leise im Hintergrund erneut versuchen
    retryCount++;
    if (retryCount <= 3) {
      setTimeout(ladeAuftraege, 5000);
    }
    // Fehlermeldung nur zeigen wenn noch NIE Daten geladen wurden
    if (!letzterErfolg) {
      document.getElementById('auftrag-tbody').innerHTML =
        '<tr><td colspan="7"><div class="leer"><div class="leer-icon">⚠️</div><div class="leer-text">Verbindungsfehler – wird automatisch erneut versucht</div></div></td></tr>';
    }
  }
}

// ── Render ──
function render(daten) {
  const tbody = document.getElementById('auftrag-tbody');

  if (!daten || daten.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7"><div class="leer"><div class="leer-icon">✅</div><div class="leer-text">Keine aktiven Aufträge</div></div></td></tr>';
    return;
  }

  tbody.innerHTML = daten.map(a => {
    const st = getStatusClass(a);
    const elapsed = getElapsedHours(a);
    const istGeplant = (a.status === 'geplant' || !a.startzeit);
    let pct;
    if (istGeplant && a.zieldatum) {
      pct = Math.min(getGeplantDringlichkeit(a) * 100, 100);
    } else {
      pct = a.startzeit ? Math.min((elapsed / a.geplante_stunden) * 100, 100) : 0;
    }
    const rest = a.geplante_stunden - elapsed;
    const ueberzogen = rest < 0 && a.startzeit && a.status !== 'geplant';
    let badgeText;
    if (istGeplant && st === 'rot') {
      const tageRest2 = Math.ceil((new Date(a.zieldatum) - new Date()) / 86400000);
      badgeText = tageRest2 <= 0 ? 'Überfällig!' : 'Dringend starten!';
    } else if (istGeplant && st === 'orange') badgeText = 'Bald starten!';
    else badgeText = { gruen:'In Bearbeitung', orange:'Bald fällig', rot:'Überzogen', geplant:'Geplant', pausiert:'Pausiert' }[st] || '';

    // Geplant-Spalte
    const geplantZelle = a.planung_typ === 'tage'
      ? `<div class="zeit-wert" style="font-size:1.1rem">📅 ${formatDatum(a.zieldatum)}</div>`
      : `<div class="zeit-wert">${formatDauer(a.geplante_stunden)}</div>`;

    // Laufzeit
    const laufzeitZelle = a.startzeit
      ? `<div class="zeit-wert">${formatDauer(elapsed)}${a.status==='pausiert' ? ' <span style="color:#c4b5fd;font-size:0.9rem">⏸</span>' : ''}</div>`
      : `<div class="zeit-wert" style="color:#4b5563">–</div>`;

    // Restzeit (groß)
    let restZelle;
    if (a.zieldatum) {
      const restWT = werktageZwischen(new Date(), new Date(a.zieldatum));
      const kalenderRest = Math.ceil((new Date(a.zieldatum) - new Date()) / 86400000);
      if (kalenderRest <= 0) {
        restZelle = `<div class="zeit-wert-gross zeit-ueberzogen blink">Überfällig!</div>`;
      } else {
        const restFarbe = st === 'orange' ? 'color:#fb923c' : st === 'rot' ? 'color:#f87171' : 'color:#93c5fd';
        restZelle = `<div class="zeit-wert-gross" style="${restFarbe}">${restWT} Werktage</div>`;
      }
    } else if (!a.startzeit || a.status === 'geplant') {
      restZelle = `<div class="zeit-wert-gross" style="color:#4b5563">–</div>`;
    } else if (ueberzogen) {
      restZelle = `<div class="zeit-wert-gross zeit-ueberzogen blink">+${formatDauer(Math.abs(rest))}</div>`;
    } else {
      restZelle = `<div class="zeit-wert-gross">${formatDauer(rest)}</div>`;
    }

    // Mitarbeiter (jetzt unter Kundename)
    const mitarbeiterBadges = (a.mitarbeiter && a.mitarbeiter.length)
      ? `<div class="ma-badges" style="margin-top:6px">${a.mitarbeiter.map(m => `<span class="ma-badge">${m}</span>`).join('')}</div>`
      : '';

    const istDringend = istGeplant && (st === 'orange' || st === 'rot');
    const kleinRow = (a.status !== 'aktiv' && !istDringend) ? ' row-klein' : '';
    return `<tr class="${kleinRow}">
      <td class="stripe-cell"><div class="stripe ${st}"></div></td>
      <td>
        <div class="td-inner">
          <div class="auftrag-nr">${a.auftragsnummer || ''}</div>
          <div class="kunde-name">${a.kunde || '–'}</div>
          ${a.beschreibung ? `<div class="beschreibung">${a.beschreibung}</div>` : ''}
          ${mitarbeiterBadges}
          ${istGeplant && st === 'rot' && a.zieldatum && Math.ceil((new Date(a.zieldatum) - new Date()) / 86400000) <= 0 ? `<div class="geplant-info" style="color:#f87171;font-weight:700">⚠️ Termin überschritten – sofort starten!</div>` : istGeplant && (st === 'orange' || st === 'rot') ? `<div class="geplant-info" style="color:#fb923c;font-weight:700">⏰ Zeit wird knapp – bald starten!</div>` : istGeplant ? `<div class="geplant-info">🕐 Noch nicht gestartet</div>` : ''}
          ${a.gestartet_von ? `<div style="font-size:0.78rem;color:#6b7280;margin-top:2px">▶ ${a.gestartet_von}</div>` : ''}
          ${a.notiz ? `<div class="notiz">📝 ${a.notiz}</div>` : ''}
        </div>
      </td>
      <td>
        <div class="td-inner">
          <span class="status-badge badge-${st}">${badgeText}</span>
          ${a.startzeit && a.status === 'aktiv' ? `<div style="font-size:0.78rem;color:#6b7280;margin-top:6px">Start: ${formatDatetime(a.startzeit)}</div>` : ''}
        </div>
      </td>
      <td><div class="td-inner">${geplantZelle}</div></td>
      <td><div class="td-inner">${laufzeitZelle}</div></td>
      <td><div class="td-inner" style="text-align:right">${restZelle}</div></td>
      <td>
        <div class="td-inner">
          <div class="progress-wrap">
            <div class="pct-text">${(a.startzeit || (istGeplant && a.zieldatum)) ? Math.round(pct) + '%' : '–'}</div>
            <div class="progress-bg">
              <div class="progress-fill fill-${st}" style="width:${pct}%"></div>
            </div>
          </div>
        </div>
      </td>
    </tr>`;
  }).join('');

  // Nach dem Rendern: Größe anpassen damit alle aktiven reinpassen
  requestAnimationFrame(() => zeilenAnpassen());
}

function zeilenAnpassen() {
  const main = document.querySelector('main');
  const tableWrap = document.querySelector('.table-wrap');
  const rows = Array.from(document.querySelectorAll('#auftrag-tbody tr'));
  if (!rows.length) return;

  // Reset
  rows.forEach(r => r.style.display = '');
  tableWrap.style.transform = '';
  tableWrap.style.transformOrigin = 'top left';
  tableWrap.style.width = '';

  const mainHeight = main.clientHeight;

  // Skalierung: von 1.0 runter bis alle aktiven Aufträge reinpassen
  let scale = 1.0;
  const minScale = 0.5;

  while (scale >= minScale) {
    tableWrap.style.transform = `scale(${scale})`;
    tableWrap.style.width = (100 / scale) + '%';

    // Letzte aktive Zeile finden (nicht row-klein)
    let letzteAktive = null;
    rows.forEach(r => {
      r.style.display = '';
      if (!r.classList.contains('row-klein')) letzteAktive = r;
    });

    if (!letzteAktive) break;

    // Prüfen ob letzte aktive Zeile reinpasst (skalierte Position)
    const rect = letzteAktive.getBoundingClientRect();
    const mainRect = main.getBoundingClientRect();
    if (rect.bottom <= mainRect.bottom) break;

    scale -= 0.03;
  }

  // Nur unwichtige Zeilen (row-klein) ausblenden die nicht reinpassen
  const mainRect = main.getBoundingClientRect();
  for (let i = rows.length - 1; i >= 0; i--) {
    const rect = rows[i].getBoundingClientRect();
    if (rect.bottom > mainRect.bottom && rows[i].classList.contains('row-klein')) {
      rows[i].style.display = 'none';
    }
  }
}

ladeAuftraege();
</script>
</body>
</html>
